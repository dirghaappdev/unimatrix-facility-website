<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="unimatrixGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="unimatrixBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Swirl / Ring Logo Mark -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Outer Blue Swoosh Arc -->
    <path d="M 50 10 A 40 40 0 0 1 90 50 A 40 40 0 0 1 65 85" fill="none" stroke="url(#unimatrixBlue)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Outer Green Swoosh Arc -->
    <path d="M 50 90 A 40 40 0 0 1 10 50 A 40 40 0 0 1 35 15" fill="none" stroke="url(#unimatrixGreen)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Inner Accent Arc -->
    <path d="M 40 18 A 32 32 0 0 1 82 50" fill="none" stroke="url(#unimatrixGreen)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M 60 82 A 32 32 0 0 1 18 50" fill="none" stroke="url(#unimatrixBlue)" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Center Modern Buildings -->
    <!-- Left Building -->
    <rect x="29" y="44" width="11" height="28" rx="1.5" fill="#0284C7" />
    <rect x="31" y="47" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="35" y="47" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="31" y="53" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="35" y="53" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="31" y="59" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="35" y="59" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="31" y="65" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="35" y="65" width="3" height="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Center Building (Tallest) -->
    <rect x="43" y="32" width="14" height="40" rx="2" fill="#047857" />
    <!-- Roof accent -->
    <polygon points="43,32 50,26 57,32" fill="#10B981" />
    <rect x="46" y="36" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="51.5" y="36" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="46" y="43" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="51.5" y="43" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="46" y="50" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="51.5" y="50" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="46" y="57" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="51.5" y="57" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="46" y="64" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="51.5" y="64" width="3.5" height="3.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Right Building -->
    <rect x="60" y="40" width="11" height="32" rx="1.5" fill="#0284C7" />
    <rect x="62" y="44" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="66" y="44" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="62" y="50" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="66" y="50" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="62" y="56" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="66" y="56" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="62" y="62" width="3" height="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="66" y="62" width="3" height="3" fill="#FFFFFF" opacity="0.9" />

    <!-- Base curve -->
    <path d="M 24 74 Q 50 78 76 74" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: unimatrix -->
  <text x="125" y="62" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="800" fill="#047857" letter-spacing="-1">
    unimatrix
  </text>
  
  <!-- Sub-label: FACILITY SOLUTIONS (OPC) PRIVATE LIMITED -->
  <text x="127" y="85" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B" letter-spacing="1.5">
    FACILITY SOLUTIONS (OPC) PRIVATE LIMITED
  </text>
</svg>