    <path d="M 50 90 A 40 40 0 0 1 10 50 A 40 40 0 0 1 35 15" fill="none" stroke="url(#unimatrixGreenWhite)" stroke-width="7" stroke-linecap="round" />
    
    <path d="M 40 18 A 32 32 0 0 1 82 50" fill="none" stroke="url(#unimatrixGreenWhite)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M 60 82 A 32 32 0 0 1 18 50" fill="none" stroke="url(#unimatrixBlueWhite)" stroke-width="3" stroke-linecap="round" opacity="0.85" />

    <!-- Left Building -->
    <rect x="29" y="44" width="11" height="28" rx="1.5" fill="#38BDF8" />
    <rect x="31" y="47" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="35" y="47" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="31" y="53" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="35" y="53" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="31" y="59" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="35" y="59" width="3" height="3" fill="#0F172A" opacity="0.8" />

    <!-- Center Building -->
    <rect x="43" y="32" width="14" height="40" rx="2" fill="#34D399" />
    <polygon points="43,32 50,26 57,32" fill="#6EE7B7" />
    <rect x="46" y="36" width="3.5" height="3.5" fill="#064E3B" opacity="0.9" />
    <rect x="51.5" y="36" width="3.5" height="3.5" fill="#064E3B" opacity="0.9" />
    <rect x="46" y="43" width="3.5" height="3.5" fill="#064E3B" opacity="0.9" />
    <rect x="51.5" y="43" width="3.5" height="3.5" fill="#064E3B" opacity="0.9" />
    <rect x="46" y="50" width="3.5" height="3.5" fill="#064E3B" opacity="0.9" />
    <rect x="51.5" y="50" width="3.5" height="3.5" fill="#064E3B" opacity="0.9" />

    <!-- Right Building -->
    <rect x="60" y="40" width="11" height="32" rx="1.5" fill="#38BDF8" />
    <rect x="62" y="44" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="66" y="44" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="62" y="50" width="3" height="3" fill="#0F172A" opacity="0.8" />
    <rect x="66" y="50" width="3" height="3" fill="#0F172A" opacity="0.8" />

    <path d="M 24 74 Q 50 78 76 74" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
