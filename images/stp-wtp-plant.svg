<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="stpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="waterTank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#stpBg)" />
  
  <!-- Aeration Tank 1 -->
  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="130" height="200" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="3" />
    <!-- Water level with bubbles -->
    <rect x="5" y="40" width="120" height="155" rx="4" fill="url(#waterTank)" opacity="0.8" />
    <!-- Air Diffuser bubbles -->
    <circle cx="25" cy="160" r="4" fill="#FFFFFF" opacity="0.6" />
    <circle cx="35" cy="130" r="6" fill="#FFFFFF" opacity="0.5" />
    <circle cx="45" cy="90" r="5" fill="#FFFFFF" opacity="0.7" />
    <circle cx="70" cy="150" r="5" fill="#FFFFFF" opacity="0.6" />
    <circle cx="85" cy="110" r="7" fill="#FFFFFF" opacity="0.5" />
    <circle cx="100" cy="140" r="4" fill="#FFFFFF" opacity="0.6" />
    <text x="15" y="25" fill="#A7F3D0" font-family="'Inter', sans-serif" font-weight="bold" font-size="11">AERATION TANK</text>
  </g>

  <!-- Clarifier Tank 2 -->
  <g transform="translate(235, 70)">
    <rect x="0" y="0" width="130" height="200" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="3" />
    <rect x="5" y="60" width="120" height="135" rx="4" fill="#0284C7" opacity="0.75" />
    <!-- Sludge scraper cone -->
    <polygon points="10,185 65,195 120,185 65,130" fill="#064E3B" opacity="0.9" />
    <text x="22" y="25" fill="#BAE6FD" font-family="'Inter', sans-serif" font-weight="bold" font-size="11">CLARIFIER TANK</text>
  </g>

  <!-- Dual Media Filter (DMF / ACF) Cylinder -->
  <g transform="translate(400, 70)">
    <rect x="0" y="20" width="130" height="180" rx="15" fill="#334155" stroke="#38BDF8" stroke-width="3" />
    <text x="15" y="45" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="bold" font-size="11">DMF / CARBON</text>
    <!-- Multiport Valve on Top -->
    <rect x="45" y="0" width="40" height="24" rx="4" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Internal Layers indicator -->
    <rect x="15" y="65" width="100" height="30" fill="#0284C7" opacity="0.5" />
    <rect x="15" y="105" width="100" height="35" fill="#1E293B" />
    <rect x="15" y="150" width="100" height="30" fill="#FBBF24" opacity="0.4" />
  </g>

  <!-- Interconnecting pipelines with flow arrows -->
  <path d="M 200 170 L 235 170" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
  <path d="M 365 170 L 400 170" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />

  <!-- Parameter Status Dashboard -->
  <g transform="translate(70, 290)">
    <rect x="0" y="0" width="460" height="60" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
    <text x="25" y="25" fill="#10B981" font-family="monospace" font-size="13" font-weight="bold">pH: 7.4 (PASS)</text>
    <text x="25" y="45" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">NEUTRAL BALANCE</text>

    <text x="175" y="25" fill="#10B981" font-family="monospace" font-size="13" font-weight="bold">BOD &lt; 10 mg/L</text>
    <text x="175" y="45" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">MPCB REUSE GRADE</text>

    <text x="325" y="25" fill="#10B981" font-family="monospace" font-size="13" font-weight="bold">TDS &lt; 450 ppm</text>
    <text x="325" y="45" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">CLEAR FLUSH WATER</text>
  </g>
</svg>