<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="glassFacade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#commBg)" />

  <!-- Modern Glass Facade Skyscraper -->
  <polygon points="120,40 280,20 280,340 120,340" fill="url(#glassFacade)" stroke="#38BDF8" stroke-width="2" />
  <!-- Glass Grid Lines -->
  <g stroke="#E0F2FE" stroke-width="1" opacity="0.6">
    <line x1="120" y1="80" x2="280" y2="60" />
    <line x1="120" y1="120" x2="280" y2="100" />
    <line x1="120" y1="160" x2="280" y2="140" />
    <line x1="120" y1="200" x2="280" y2="180" />
    <line x1="120" y1="240" x2="280" y2="220" />
    <line x1="120" y1="280" x2="280" y2="260" />

    <line x1="160" y1="35" x2="160" y2="340" />
    <line x1="200" y1="30" x2="200" y2="340" />
    <line x1="240" y1="25" x2="240" y2="340" />
  </g>

  <!-- Right Building Wing -->
  <polygon points="280,20 440,60 440,340 280,340" fill="#0369A1" opacity="0.6" stroke="#38BDF8" stroke-width="2" />
  <g stroke="#E0F2FE" stroke-width="1" opacity="0.5">
    <line x1="280" y1="60" x2="440" y2="100" />
    <line x1="280" y1="100" x2="440" y2="140" />
    <line x1="280" y1="140" x2="440" y2="180" />
    <line x1="280" y1="180" x2="440" y2="220" />
    <line x1="280" y1="220" x2="440" y2="260" />
    <line x1="280" y1="260" x2="440" y2="300" />

    <line x1="320" y1="30" x2="320" y2="340" />
    <line x1="360" y1="40" x2="360" y2="340" />
    <line x1="400" y1="50" x2="400" y2="340" />
  </g>

  <!-- Base Plaza -->
  <rect x="0" y="340" width="600" height="60" fill="#0F172A" />
  <line x1="0" y1="340" x2="600" y2="340" stroke="#38BDF8" stroke-width="2" />

  <text x="30" y="375" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="bold" font-size="14">COMMERCIAL BUILDINGS, OFFICES &amp; IT PARKS</text>
</svg>