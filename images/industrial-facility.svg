<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#indBg)" />

  <!-- Industrial Sawtooth Roof Warehouse Factory -->
  <g transform="translate(60, 100)">
    <!-- Main Plant Profile -->
    <path d="M 0 160 L 0 60 L 80 0 L 80 60 L 160 0 L 160 60 L 240 0 L 240 60 L 320 0 L 320 160 Z" fill="#334155" stroke="#F59E0B" stroke-width="3" />
    
    <!-- Chimneys / Exhaust Stacks -->
    <rect x="360" y="-30" width="25" height="190" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="410" y="-60" width="30" height="220" fill="#475569" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Chimney stripes -->
    <rect x="410" y="-45" width="30" height="15" fill="#EF4444" />
    <rect x="410" y="-15" width="30" height="15" fill="#EF4444" />
    <rect x="410" y="15" width="30" height="15" fill="#EF4444" />

    <!-- Factory Windows & Rolling Shutters -->
    <rect x="30" y="90" width="60" height="70" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
    <!-- Shutter slats -->
    <line x1="30" y1="105" x2="90" y2="105" stroke="#475569" stroke-width="2" />
    <line x1="30" y1="120" x2="90" y2="120" stroke="#475569" stroke-width="2" />
    <line x1="30" y1="135" x2="90" y2="135" stroke="#475569" stroke-width="2" />
    <line x1="30" y1="150" x2="90" y2="150" stroke="#475569" stroke-width="2" />

    <rect x="130" y="90" width="60" height="70" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
    <line x1="130" y1="105" x2="190" y2="105" stroke="#475569" stroke-width="2" />
    <line x1="130" y1="120" x2="190" y2="120" stroke="#475569" stroke-width="2" />
    <line x1="130" y1="135" x2="190" y2="135" stroke="#475569" stroke-width="2" />
    <line x1="130" y1="150" x2="190" y2="150" stroke="#475569" stroke-width="2" />

    <rect x="230" y="90" width="60" height="70" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
    <line x1="230" y1="105" x2="290" y2="105" stroke="#475569" stroke-width="2" />
    <line x1="230" y1="120" x2="290" y2="120" stroke="#475569" stroke-width="2" />
    <line x1="230" y1="135" x2="290" y2="135" stroke="#475569" stroke-width="2" />
    <line x1="230" y1="150" x2="290" y2="150" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Industrial Base Road -->
  <rect x="0" y="320" width="600" height="80" fill="#0F172A" />
  <line x1="0" y1="320" x2="600" y2="320" stroke="#F59E0B" stroke-width="3" />

  <text x="30" y="365" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="bold" font-size="14">INDUSTRIAL PROPERTIES, WAREHOUSES &amp; PLANTS</text>
</svg>