<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="plumbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#plumbBg)" />
  
  <!-- Piping Grid Network -->
  <!-- Horizontal Main Pipeline -->
  <rect x="50" y="240" width="500" height="24" rx="4" fill="url(#pipeGrad)" stroke="#E0F2FE" stroke-width="1.5" />
  <!-- Vertical Riser Pipe -->
  <rect x="180" y="80" width="22" height="170" rx="3" fill="url(#pipeGrad)" stroke="#E0F2FE" stroke-width="1.5" />
  <rect x="420" y="80" width="22" height="170" rx="3" fill="url(#pipeGrad)" stroke="#E0F2FE" stroke-width="1.5" />
  
  <!-- Pipe Flanges -->
  <rect x="174" y="160" width="34" height="10" rx="2" fill="#0369A1" stroke="#BAE6FD" stroke-width="1" />
  <rect x="414" y="160" width="34" height="10" rx="2" fill="#0369A1" stroke="#BAE6FD" stroke-width="1" />
  <rect x="290" y="235" width="12" height="34" rx="2" fill="#0369A1" stroke="#BAE6FD" stroke-width="1" />

  <!-- Commercial Motor Pump 1 -->
  <g transform="translate(100, 180)">
    <!-- Pump Casing / Impeller housing -->
    <circle cx="50" cy="50" r="42" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <circle cx="50" cy="50" r="22" fill="#0284C7" />
    <!-- Motor body -->
    <rect x="80" y="20" width="80" height="60" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Cooling Fins -->
    <line x1="95" y1="20" x2="95" y2="80" stroke="#475569" stroke-width="2" />
    <line x1="110" y1="20" x2="110" y2="80" stroke="#475569" stroke-width="2" />
    <line x1="125" y1="20" x2="125" y2="80" stroke="#475569" stroke-width="2" />
    <line x1="140" y1="20" x2="140" y2="80" stroke="#475569" stroke-width="2" />
    <!-- Base Plate -->
    <rect x="30" y="90" width="140" height="14" rx="3" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
  </g>

  <!-- Commercial Motor Pump 2 -->
  <g transform="translate(340, 180)">
    <circle cx="50" cy="50" r="42" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <circle cx="50" cy="50" r="22" fill="#0284C7" />
    <rect x="80" y="20" width="80" height="60" rx="4" fill="#334155" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="95" y1="20" x2="95" y2="80" stroke="#475569" stroke-width="2" />
    <line x1="110" y1="20" x2="110" y2="80" stroke="#475569" stroke-width="2" />
    <line x1="125" y1="20" x2="125" y2="80" stroke="#475569" stroke-width="2" />
    <line x1="140" y1="20" x2="140" y2="80" stroke="#475569" stroke-width="2" />
    <rect x="30" y="90" width="140" height="14" rx="3" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
  </g>

  <!-- Pressure Dial Gauge -->
  <g transform="translate(191, 70)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#E2E8F0" stroke-width="1" />
    <path d="M -12 6 A 14 14 0 1 1 12 6" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="2,2" />
    <!-- Needle -->
    <line x1="0" y1="0" x2="8" y2="-12" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="3" fill="#0F172A" />
    <text x="-12" y="14" fill="#0F172A" font-family="'Inter', sans-serif" font-weight="bold" font-size="6">BAR / PSI</text>
  </g>

  <!-- Water Valve Wheel -->
  <g transform="translate(431, 70)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#EF4444" stroke-width="4" />
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#EF4444" stroke-width="3" />
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#EF4444" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#EF4444" />
  </g>

  <!-- Title Badge -->
  <rect x="60" y="325" width="480" height="45" rx="10" fill="#0F172A" opacity="0.9" stroke="#38BDF8" stroke-width="1" />
  <text x="80" y="352" fill="#BAE6FD" font-family="'Inter', sans-serif" font-weight="bold" font-size="14">WATER PRESSURE & TANK LEVEL: NORMAL (24/7 ACTIVE)</text>
</svg>